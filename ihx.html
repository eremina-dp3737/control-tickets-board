<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="index.js" defer></script>
    <style>
        #OpenTickets{
            font-size: 40px;
        }
        .tops{
            display: flex;
            flex-direction: row;
            justify-content: start;
            gap: 15px;
            font-size: 15px;
            font-family: Arial, Helvetica, sans-serif;
        }
        #TicketsList{
            display: flex;
            flex-direction: column;
            font-size: 20px;
            gap: 10px;
        }
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1{
            font-size: 50px;
        }
    </style>
</head>
<body>
    <h1>Заявки корпуса</h1>
    <label id="OpenTickets">Открытые заявки</label>
    <div class="tops">
        <h2>Что случилось?</h2>
        <h2>Где?</h2>
        <h2>Категория</h2>
    </div>
    
    <ul id="TicketsList"></ul>
    <div class="PushTick">
        <input id="TitleName" type="text">
        <input id="RoomNumber" type="text">
        <select id="CategoryName">
            <option id="FirstCat">Оборудование</option>
            <option id="SecondCat">Аудитория</option>
            <option id="ThirdCat">Другое</option>
        </select>
        <button id="ButtonPushHelp">Добавить заявку</button>
    </div>
    
</body>
</html>
